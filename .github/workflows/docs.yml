name: Build docs
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

env:
  UV_FROZEN: true # https://docs.astral.sh/uv/configuration/environment/#uv_frozen

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.14' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: false
          python-version: ${{ matrix.python-version }}

      - name: Install SuiteSparse
        run: sudo apt-get install -y libsuitesparse-dev

      - name: Build docs
        run: |
          uv sync --extra doc
          uv run python -m ipykernel install --user
          uv run sphinx-build -c docs/source/ -b html docs/source/ docs/build/html -W
