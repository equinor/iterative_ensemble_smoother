name: Run tests
permissions:
  contents: read

on: [pull_request]

env:
  UV_FROZEN: true # https://docs.astral.sh/uv/configuration/environment/#uv_frozen


jobs:
  tests:
    name: "Python ${{ matrix.python-version }}"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: false
          python-version: ${{ matrix.python-version }}

      # Run tests WITHOUT libsuitesparse and scikit-sparse

      - run: uv sync --extra dev

      - name: pytest
        run: uv run pytest -ra -m 'not suitesparse' --durations=5

      - name: doctest
        run: uv run pytest src/ --doctest-modules --ignore-glob='**/enif*'

      # Run tests WITH libsuitesparse and scikit-sparse

      - name: Install SuiteSparse
        run: sudo apt-get install -y libsuitesparse-dev

      - run: uv sync --extra dev --extra sparse

      - name: pytest
        run: uv run pytest -ra -m 'suitesparse'

      - name: doctest
        run: uv run pytest src/ --doctest-modules
